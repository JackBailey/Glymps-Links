<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glymps</title>
    <link rel="shortcut icon" type="image/jpg" href="/img/logo.png" />
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script defer src="/status.js"></script>
</head>

<body>
    <div class="content">
        <div class="header">
            <div id="avatarContainer">
                <img id="avatar" src="/img/animated.gif" alt="Avatar" />
            </div>
            <div id="headerInfo">
                <div id="headerText">
                    <a class="username" id="username"></a>&nbsp;
                    <div class="onlineBox">
                        <div id="status-icon"></div>
                        <p id="status"></p>
                    </div>
                </div>
                <p id="description">
                    Hi, I'm Glymps - I'm from the UK. You may also know me as 
                        <a style="font-weight:bold;" class="hovereffect" href="https://jackbailey.dev">Jack</a>

                    <br/><br/>I don't have much of an online presence at this point for gaming, but you can find me on Steam and Discord.
                </p>
            </div>
        </div>
        <div class="socials">
            <div data-tilt data-tilt-gyroscope=false>
                <a href="https://steamcommunity.com/id/glymps">
                    <div>
                        <img src="/img/svg/steam.svg"></img>
                        <h1>Steam</h1>
                    </div>
                </a>
            </div>
            <div data-tilt data-tilt-gyroscope=false>
                <a href="https://discord.com/users/386175804742303754">
                    <div>
                        <img src="/img/svg/discord.svg"></img>
                        <h1>Discord</h1>
                    </div>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
